<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reactive Signs 2026 — Exhibition</title>
    <script>
      if (
        new URLSearchParams(window.location.search).get("presentation") === "1"
      ) {
        document.documentElement.classList.add("launch-presentation");
      }
    </script>
    <script src="poster-dimensions.js"></script>
    <script src="teams.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Single poster preview. Controlled by the mouse, and automatically by
       pose tracking (OSC) when cameraPoseOSC is running. -->
    <iframe id="poster" class="posterFrame" src="Teams/Example/index.html">
      Your browser doesn't support iframes
    </iframe>

    <!-- Presentation-mode label: current poster name and position. -->
    <div id="posterLabel" class="posterLabel" aria-live="polite"></div>

    <button id="fullscreenButton" class="fullscreenButton" type="button">
      Fullscreen
    </button>
    <button id="presentationButton" class="presentationButton" type="button">
      Presentation mode
    </button>

    <!-- Bottom-right view switcher. -->
    <nav class="viewSwitch">
      <a href="./" class="active">Poster</a>
      <a href="InfinityRoom/">Infinity room</a>
      <a href="Tracking/">Room Tracking</a>
    </nav>

    <script>
      const fullscreenButton = document.getElementById("fullscreenButton");
      const presentationButton = document.getElementById("presentationButton");
      const root = document.documentElement;
      const launchPresentation = root.classList.contains(
        "launch-presentation",
      );

      function isFullscreen() {
        return Boolean(
          document.fullscreenElement || document.webkitFullscreenElement,
        );
      }

      function updateFullscreenButton() {
        const fullscreen = isFullscreen();
        if (!fullscreen) {
          document.body.classList.remove("presentation-mode");
        }

        fullscreenButton.textContent = fullscreen
          ? "Exit fullscreen"
          : "Fullscreen";
        fullscreenButton.setAttribute("aria-pressed", String(fullscreen));

        const presenting =
          fullscreen && document.body.classList.contains("presentation-mode");
        presentationButton.textContent = presenting
          ? "Exit presentation"
          : "Presentation mode";
        presentationButton.setAttribute("aria-pressed", String(presenting));
      }

      async function enterFullscreen() {
        const requestFullscreen =
          root.requestFullscreen || root.webkitRequestFullscreen;
        await requestFullscreen?.call(root);
      }

      async function exitFullscreen() {
        const closeFullscreen =
          document.exitFullscreen || document.webkitExitFullscreen;
        await closeFullscreen?.call(document);
      }

      fullscreenButton.addEventListener("click", async function () {
        try {
          if (isFullscreen()) {
            await exitFullscreen();
          } else {
            await enterFullscreen();
          }
        } catch (error) {
          console.error("Could not change fullscreen mode.", error);
        }
      });

      presentationButton.addEventListener("click", async function () {
        try {
          const presenting =
            document.body.classList.contains("presentation-mode");

          if (presenting) {
            document.body.classList.remove("presentation-mode");
            if (isFullscreen()) await exitFullscreen();
          } else {
            document.body.classList.add("presentation-mode");
            if (!isFullscreen()) await enterFullscreen();
            updateFullscreenButton();
          }
        } catch (error) {
          document.body.classList.remove("presentation-mode");
          updateFullscreenButton();
          console.error("Could not enter presentation mode.", error);
        }
      });

      document.addEventListener("fullscreenchange", updateFullscreenButton);
      document.addEventListener(
        "webkitfullscreenchange",
        updateFullscreenButton,
      );

      if (launchPresentation) {
        document.body.classList.add("presentation-mode");
      }
      updateFullscreenButton();

      window.addEventListener("keydown", function (event) {
        if (
          launchPresentation &&
          (event.key === "Escape" || event.key === "F11")
        ) {
          root.classList.remove("launch-presentation");
          document.body.classList.remove("presentation-mode");
          updateFullscreenButton();
        }
      });
    </script>

    <!-- Presentation mode: switch between team posters by keyboard. -->
    <script src="poster-switcher.js"></script>
    <script>
      initPosterSwitcher({
        frame: "poster",
        label: "posterLabel",
        basePath: "Teams/",
      });
    </script>
  </body>
</html>
